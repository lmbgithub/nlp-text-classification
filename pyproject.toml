[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsgroups-classification"
version = "0.1.0"
description = "Transformer against a dense baseline on 20 Newsgroups, under identical conditions"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The corpus, split, truncation and metrics code is standard library only.
# TensorFlow is needed to train, and nothing else in the package imports it.
train = ["tensorflow>=2.16", "numpy>=1.24"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
newsgroups = "newsgroups.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplification, C4 comprehensions, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on constructed values; long descriptive names are the point.
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
